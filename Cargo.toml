[package]
name = "vectorcraft-plugin-letter-extrude"
description = "VectorCraft WebAssembly object filter plug-in: Lettering Extrude (2D offset fake-perspective extrusion)"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

# Not a member of the VectorCraft workspace: it builds for wasm32-unknown-unknown only.
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
